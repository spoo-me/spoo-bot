# SpooBot v2 configuration template
# Copy to config.toml and fill in the values. `${NAME}` values are read from
# the environment (a local .env file is loaded automatically).

[bot]
command_prefix = "$"
name = "SpooBot"
description = ""
bot_token = "${BOT_TOKEN}" # Environment variable for security
custom_status = ""         # Custom status message for the bot
super_user_id = ""         # Discord User ID of the bot owner
parent_server_id = ""      # Support server ID (welcome + stats channels live here)

# Custom emoji IDs used on share buttons (optional)
[emojis]
twitter = ""
facebook = ""
telegram = ""
whatsapp = ""
reddit = ""
snapchat = ""
git = ""
spoo = ""

[spoo]
api_base = "https://spoo.me"
qr_api_base = "https://qr.spoo.me"

[auth]
app_id = "spoo-discord"
state_secret = "${STATE_SECRET}" # >=32 chars; generate: openssl rand -hex 32
vault_key = "${VAULT_KEY}"       # Fernet key; generate: uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
vault_path = "data/vault.sqlite3"
link_ttl_seconds = 600

[web]
enabled = true
host = "0.0.0.0"
port = 9274
public_callback_url = "https://discord-bot.spoo.me/callback"

[charts]
renderer = "quickchart" # or "htmlcards" (requires: uv sync --group cards)
quickchart_url = "https://quickchart.io"

# Command cooldowns (apply to all commands)
[cooldowns]
short_term = { count = 1, seconds = 10 }
medium_term = { count = 5, seconds = 60 }
long_term = { count = 200, seconds = 86400 } # 24 hours

# Support-server channel IDs (optional; leave empty to disable)
[channels]
welcome = ""
stats_clicks = ""
stats_shortlinks = ""

[urls]
discord_invite = "https://spoo.me/discord"
bot_invite = ""
github = "https://github.com/spoo-me/spoo-bot"
dashboard_apps = "https://spoo.me/dashboard/apps"
