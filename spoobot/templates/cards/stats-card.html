<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:800px; background:#000; color:#dcddde;
         font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  .card { padding:28px 32px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px; }
  h1 { font-size:20px; color:#fff; }
  .accent { color:#497dff; }
  .nums { display:flex; gap:28px; margin-bottom:20px; }
  .num b { display:block; font-size:28px; color:#fff; }
  .num span { font-size:12px; color:#8a8e96; text-transform:uppercase; letter-spacing:.06em; }
  .bars { display:grid; gap:8px; }
  .bar { display:grid; grid-template-columns: 110px 1fr 48px; gap:10px; align-items:center; }
  .bar .track { background:#1d1f24; border-radius:6px; height:14px; overflow:hidden; }
  .bar .fill { background:linear-gradient(90deg,#497dff,#7289da); height:100%; border-radius:6px; }
  .bar .label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .val { text-align:right; color:#8a8e96; }
</style></head>
<body><div class="card">
  <div class="head"><h1>{{title}}</h1><div class="accent">spoo.me</div></div>
  <div class="nums">{{numbers}}</div>
  <div class="bars">{{bars}}</div>
</div></body></html>
